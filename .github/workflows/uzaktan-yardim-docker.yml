# Uzaktan Yardım — izin listesi yamalı hbbs/hbbr imajını GHCR'ye yükler.
# İmaj gizli bilgi içermez (sunucu adresi/izin listesi VDS'te, çalışma zamanında verilir).

name: Uzaktan Yardim Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "İmaj etiketi (ör. 1.1.16-uy1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: uzaktan-yardim.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/uzaktan-yardim-server:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/uzaktan-yardim-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
